name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    name: Static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      # The layer rule, asserted rather than assumed. See scripts/check-layer.mjs.
      - name: Layering
        run: node scripts/check-layer.mjs
        if: hashFiles('scripts/check-layer.mjs') != ''

      - name: Typecheck
        run: npx tsc --noEmit
        if: hashFiles('tsconfig.json') != ''

      # A18 — the escape suite is a HARD gate. No `if: hashFiles(...)` guard:
      # a required step that runs only when a script exists is D013 — a gate
      # that passes by being absent. Each test provably fails when its
      # mitigation is removed (see src/escape-suite.spec.ts).
      - name: Escape suite (A18)
        run: npm run test:escape
